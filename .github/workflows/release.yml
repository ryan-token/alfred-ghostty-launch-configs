name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: ./tests/run.js

      - name: Build workflow
        run: ./build.sh

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.alfredworkflow
          generate_release_notes: true
